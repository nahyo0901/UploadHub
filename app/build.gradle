plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

android {
    namespace 'dev.nahyo0901.uploadhub'
    compileSdk 34

    defaultConfig {
        applicationId "dev.nahyo0901.uploadhub"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildFeatures {
        compose true
    }

    // composeOptions block removed — kotlinCompilerExtensionVersion is
    // no longer needed when using the kotlin.plugin.compose Gradle plugin (Kotlin 2.0+)

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/*']
        }
    }
}

dependencies {

    // ---------- Core ----------
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material

    // ---------- Compose ----------
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    debugImplementation libs.compose.ui.tooling

    // ---------- Coroutines / Networking ----------
    implementation libs.kotlinx.coroutines.android
    implementation libs.okhttp
    implementation libs.okio

    // ---------- Room (KSP) ----------
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    // ---------- DataStore ----------
    implementation libs.datastore.preferences

    // ---------- FTP ----------
    implementation libs.commons.net

    // ---------- Navigation ----------
    implementation libs.navigation.compose

    // ---------- Multidex ----------
    implementation libs.multidex
}
