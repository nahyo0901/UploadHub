plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.twice.whatislove.uploadhub'
    compileSdk 34

    defaultConfig {
        applicationId "com.twice.whatislove.uploadhub"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.0' }
    kotlinOptions { jvmTarget = '1.8' }
    packagingOptions { resources.excludes += ['/META-INF/*'] }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Compose & Material3
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui:1.5.0'
    implementation 'androidx.compose.material3:material3:1.1.0-alpha15'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.5.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.5.0'

    // Networking / uploads
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Room (upload history)
    implementation 'androidx.room:room-runtime:2.5.2'
    kapt 'androidx.room:room-compiler:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.2.0'

    // FTP client (commons-net)
    implementation 'commons-net:commons-net:3.8.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.0'

    // Multidex
    implementation 'androidx.multidex:multidex:2.0.1'
}
