name: Manual Clean Build (Truth Build)

on:
  workflow_dispatch:
    inputs:
      java-version:
        description: 'JDK version'
        default: '17'
      gradle-args:
        description: 'Extra Gradle args'
        default: ''

permissions:
  contents: read

concurrency:
  group: clean-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.java-version }}

      - run: chmod +x ./gradlew

      - name: Clean build (no cache)
        run: ./gradlew clean build --no-build-cache --stacktrace ${{ github.event.inputs.gradle-args }}