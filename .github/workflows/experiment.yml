name: Claude Fix Build Errors

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x ./gradlew

      # run build but don't fail job
      - name: Run build and capture errors
        id: build
        run: |
          set +e
          ./gradlew clean build --no-build-cache --stacktrace | tee build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log

      - name: Claude fixes the project
        if: steps.build.outputs.exit_code != 0
        uses: anthropics/claude-code-action@v1