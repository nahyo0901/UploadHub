name: Claude Fix Build Errors

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # CHECKOUT
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------
      # JAVA SETUP
      # ---------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ---------------------------
      # BUILD (SAFE + RELIABLE)
      # ---------------------------
      - name: Run build and capture result
        id: build
        run: |
          set +e
          set -o pipefail

          ./gradlew clean build --no-build-cache --stacktrace 2>&1 | tee build.log
          EXIT_CODE=$?

          echo $EXIT_CODE > build_exit.txt
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          exit 0

      # ---------------------------
      # READ BUILD RESULT (ROBUST FIX)
      # ---------------------------
      - name: Read build result safely
        id: result
        run: |
          echo "exit_code=$(cat build_exit.txt)" >> $GITHUB_OUTPUT

      # ---------------------------
      # ALWAYS UPLOAD LOGS
      # ---------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log

      # ---------------------------
      # CLAUDE FIX STEP (ONLY ON FAILURE)
      # ---------------------------
      - name: Claude fixes the project
        if: steps.result.outputs.exit_code != '0'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Fix all build errors in this Android Gradle project.

            Use build.log as reference.

            Ensure the project successfully builds with:
            ./gradlew clean build

            Do not introduce breaking changes.

      # ---------------------------
      # CREATE BRANCH + PR (RELIABLE)
      # ---------------------------
      - name: Create Pull Request
        if: steps.result.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="claude/fix-build-$(date +%s)"

          git checkout -b $BRANCH

          git add .

          git commit -m "fix: automated build fixes by Claude" || echo "No changes to commit"

          git push origin $BRANCH

          gh pr create \
            --title "🤖 Claude Auto Fix Build Errors" \
            --body "Auto-generated PR after build failure. Build logs are available in artifacts." \
            --head $BRANCH \
            --base main || true