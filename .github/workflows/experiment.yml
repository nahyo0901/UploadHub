name: Claude Fix Build Errors

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ---------------------------
      # BUILD STEP (FIXED EXIT CODE)
      # ---------------------------
      - name: Run build and capture errors
        id: build
        run: |
          set -o pipefail
          ./gradlew clean build --no-build-cache --stacktrace 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log

      # ---------------------------
      # CLAUDE FIX STEP
      # ---------------------------
      - name: Claude fixes the project
        if: steps.build.outputs.exit_code != '0'
        uses: anthropics/claude-code-action@v1
        with:
          # (If supported by your version of the action)
          prompt: |
            Fix all build errors in this Android Gradle project.
            Ensure the project builds successfully with ./gradlew clean build.
            Do not introduce breaking changes.

      # ---------------------------
      # CREATE BRANCH + PR
      # ---------------------------
      - name: Create Pull Request
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="claude/fix-build-$(date +%s)"

          git checkout -b $BRANCH

          git add .

          git commit -m "fix: automated build fixes by Claude" || echo "No changes to commit"

          git push origin $BRANCH

          gh pr create \
            --title "🤖 Claude Auto Fix: Build Errors" \
            --body "This PR was automatically generated by Claude after fixing build errors from CI logs." \
            --head $BRANCH \
            --base main || true